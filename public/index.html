<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Village — エージェント可視化ダッシュボード</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
  <div id="app">
    <header id="hud-header">
      <h1>🏠 Agent Village</h1>
      <div id="view-switcher">
        <button class="tab-btn active" data-view="office" type="button">オフィス</button>
        <button class="tab-btn" data-view="reports" type="button">レポート</button>
        <button class="tab-btn" data-view="config" type="button">構成</button>
      </div>
      <div id="status-summary" aria-live="polite"></div>
      <button class="btn" id="notify-toggle" type="button">🔕 通知オフ</button>
      <div id="layout-controls">
        <select id="layout-select" aria-label="オフィスの配置">
          <option value="auto">🖥 自動</option>
          <option value="wide">🖥 デスクトップ</option>
          <option value="square">📱 モバイル</option>
        </select>
        <button class="btn" id="fullscreen-btn" type="button">⛶ 全画面</button>
      </div>
      <div id="project-switcher">
        <button class="project-btn" id="project-current" type="button" aria-haspopup="true" aria-expanded="false">
          <span class="project-icon">📁</span>
          <span class="project-text">
            <span class="project-name" id="project-name">読み込み中…</span>
            <span class="project-path" id="project-path"></span>
          </span>
          <span class="project-caret">▾</span>
        </button>
        <div id="project-menu" class="project-menu" hidden></div>
      </div>
      <span id="conn-status" class="badge badge-offline">接続待ち…</span>
      <span id="server-time"></span>
    </header>

    <main id="hud-main">
      <div id="game-container"></div>

      <aside id="hud-sidebar">
        <div id="tab-bar">
          <button class="tab-btn active" data-tab="agents" type="button">エージェント</button>
          <button class="tab-btn" data-tab="rooms" type="button">部屋</button>
        </div>

        <div id="tab-agents" class="tab-panel">
          <div class="agents-head">
            <h2>エージェント一覧</h2>
            <div id="unread-wrap">
              <button type="button" id="unread-badge" class="unread-badge" aria-haspopup="true" aria-expanded="false">未読なし</button>
              <div id="unread-pop" class="unread-pop" hidden></div>
              <div id="unread-toast" class="unread-toast" role="status" hidden></div>
            </div>
          </div>
          <ul id="agent-list"></ul>
          <div id="agent-detail-panel" class="detail-panel empty">
            <p class="hint">キャラクター、または一覧の項目をクリックすると詳細が表示されます。</p>
          </div>
        </div>

        <div id="tab-rooms" class="tab-panel" hidden>
          <div class="row" style="justify-content: space-between;">
            <h2 style="margin:0;">部屋一覧</h2>
            <button class="btn" id="room-add-toggle-btn" type="button">＋ 部屋を追加</button>
          </div>
          <div id="room-add-form" class="appearance-editor" hidden>
            <div class="row">
              <input type="text" id="room-add-label" placeholder="部屋名（例: 動画編集部屋）" />
            </div>
            <div class="row">
              <input type="text" id="room-add-keywords" placeholder="判定キーワード（カンマ区切り、任意）" />
            </div>
            <div class="appearance-notes">キーワードを含む名前/説明のエージェントが自動的にこの部屋へ配置されます。空でも作成できます（その場合は明示的な room: 指定でのみ配置されます）。</div>
            <div class="row">
              <button class="btn" id="room-add-submit-btn" type="button">作成する</button>
              <button class="btn" id="room-add-cancel-btn" type="button">キャンセル</button>
            </div>
            <div id="room-add-msg"></div>
          </div>
          <ul id="room-list"></ul>
          <div id="room-detail-panel" class="detail-panel empty">
            <p class="hint">部屋をクリックすると名前や見た目を編集できます。</p>
          </div>
        </div>
      </aside>
    </main>

    <section id="reports-view" hidden>
      <div class="row" id="reports-filter-bar">
        <select id="reports-agent-filter"><option value="">すべてのエージェント</option></select>
        <label><input type="checkbox" class="reports-level-cb" value="info" checked /> info</label>
        <label><input type="checkbox" class="reports-level-cb" value="warn" checked /> warn</label>
        <label><input type="checkbox" class="reports-level-cb" value="error" checked /> error</label>
        <label><input type="checkbox" class="reports-level-cb" value="result" checked /> result</label>
        <input type="text" id="reports-search-input" placeholder="キーワード検索…" />
      </div>
      <div id="reports-list" class="detail-panel"></div>
      <button class="btn" id="reports-load-more-btn" type="button" hidden>もっと読み込む</button>
    </section>

    <section id="config-view" hidden>
      <div id="config-toolbar">
        <div id="config-scope" role="group" aria-label="表示する範囲">
          <button type="button" data-scope="all">すべて</button>
          <button type="button" data-scope="project">プロジェクト</button>
          <button type="button" data-scope="user">ユーザー全体</button>
        </div>
        <div id="config-summary"></div>
        <span id="config-root" class="config-root"></span>
        <button class="btn" id="config-reload-btn" type="button">再読み込み</button>
      </div>
      <div id="config-body">
        <div id="village-settings"></div>
        <div id="config-cards"><p class="hint">読み込み中…</p></div>
      </div>
    </section>
  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
